<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Yuvraj Company | GitHub Explorer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Floating Clouds -->
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>

    <div class="main">

        <h1 class="title">
            <span class="brand">Yuvraj Company</span><br>
            GitHub Profile Explorer
        </h1>

        <p class="subtitle">A calm & animated profile viewer ✨</p>

        <div class="searchBox">
            <input type="text" id="userID" placeholder="Enter GitHub Username">
            <button id="btn">Search</button>
        </div>

        <div class="secondDiv" id="userProfile">
            <h2>🌿 Search a GitHub User</h2>
        </div>

    </div>

    <script src="index.js"></script>
</body>
</html>
